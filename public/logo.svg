<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background stone texture gradients -->
    <radialGradient id="bgVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#181a1f" />
      <stop offset="55%" stop-color="#0e1014" />
      <stop offset="100%" stop-color="#060709" />
    </radialGradient>

    <!-- Mountain white highlight gradient -->
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eceff4" />
    </linearGradient>

    <!-- Drop shadow for typography -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Dark slate background -->
  <rect width="600" height="600" fill="url(#bgVignette)" />

  <!-- Subtle organic rock texture grain overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="30" y1="90" x2="110" y2="85" />
    <line x1="450" y1="120" x2="560" y2="110" />
    <line x1="80" y1="480" x2="190" y2="490" />
    <line x1="420" y1="520" x2="520" y2="505" />
  </g>

  <!-- ============================================== -->
  <!-- 01. THE BLACKSTONE MOUNTAIN RANGE              -->
  <!-- ============================================== -->
  <g id="mountain-range" transform="translate(0, 20)">
    <!-- Shadow Silhouette Base -->
    <polygon points="
      300,105 322,145 348,168 375,188 402,205 440,240 488,272 525,282 
      545,286 480,290 300,292 120,290 55,286 75,282 112,272 160,240 
      198,205 225,188 252,168 278,145
    " fill="#0b0d11" />

    <!-- Center Main Peak (White Lit Faces & Ridges) -->
    <!-- Center Spine & Left Face -->
    <polygon points="300,105 292,138 278,162 268,195 252,228 238,255 210,278 185,288 300,290" fill="url(#snowGrad)" />
    <!-- Sharp cuts in left snow face (rock shadows) -->
    <polygon points="286,140 274,168 282,175" fill="#0e1014" />
    <polygon points="268,188 252,216 264,220" fill="#0e1014" />
    <polygon points="248,228 232,254 242,258" fill="#0e1014" />
    <polygon points="228,260 205,282 220,285" fill="#0e1014" />

    <!-- Center Spine & Right Face (Shadowed with illuminated rock fractures) -->
    <polygon points="300,105 308,138 322,162 332,195 348,228 362,255 390,278 415,288 300,290" fill="#13161c" />
    <!-- Illuminated rock facets on the right dark face -->
    <polygon points="300,105 307,135 301,137" fill="#ffffff" />
    <polygon points="308,138 325,160 316,164" fill="#ffffff" />
    <polygon points="322,162 342,192 330,196" fill="#ffffff" />
    <polygon points="332,195 358,225 345,230" fill="#ffffff" />
    <polygon points="348,228 375,258 360,262" fill="#ffffff" />
    <polygon points="362,255 398,284 382,286" fill="#ffffff" />

    <!-- Left Flanking Peak (Around x=180, y=170) -->
    <polygon points="180,172 170,198 152,225 130,256 100,282 70,286 185,288" fill="url(#snowGrad)" />
    <polygon points="180,172 195,198 215,235 235,268 180,288" fill="#13161c" />
    <!-- Facets on Left Peak -->
    <polygon points="168,198 156,220 165,224" fill="#0e1014" />
    <polygon points="148,230 132,255 142,258" fill="#0e1014" />
    <polygon points="180,172 188,195 182,197" fill="#ffffff" />
    <polygon points="195,198 210,225 202,228" fill="#ffffff" />
    <polygon points="212,232 228,260 218,263" fill="#ffffff" />

    <!-- Far Left Ridge & Foot (x=60 to 120) -->
    <polygon points="120,220 108,242 85,268 55,286 130,288" fill="url(#snowGrad)" />
    <polygon points="108,245 95,268 104,270" fill="#0e1014" />

    <!-- Right Flanking Peak (Around x=420, y=172) -->
    <polygon points="420,172 405,198 385,235 365,268 420,288" fill="url(#snowGrad)" />
    <polygon points="420,172 430,198 448,225 470,256 500,282 530,286 415,288" fill="#13161c" />
    <!-- Facets on Right Peak -->
    <polygon points="402,198 390,220 398,224" fill="#0e1014" />
    <polygon points="382,230 368,255 376,258" fill="#0e1014" />
    <polygon points="420,172 428,195 422,197" fill="#ffffff" />
    <polygon points="430,198 445,225 438,228" fill="#ffffff" />
    <polygon points="448,228 468,260 458,263" fill="#ffffff" />

    <!-- Far Right Ridge & Foot (x=480 to 545) -->
    <polygon points="480,220 492,242 515,268 545,286 470,288" fill="#13161c" />
    <polygon points="480,220 490,240 484,242" fill="#ffffff" />
    <polygon points="492,242 510,268 502,270" fill="#ffffff" />

    <!-- Dramatic Rocky Crevices & Jagged Cuts (Blackthorne character) -->
    <g fill="#0e1014">
      <polygon points="296,160 300,195 294,185" />
      <polygon points="280,210 286,245 278,235" />
      <polygon points="255,240 262,275 252,265" />
      <polygon points="165,240 172,270 162,262" />
    </g>
    <!-- Crisp White Snow Crest Edges -->
    <polyline points="55,286 112,272 160,240 180,172 238,255 300,105 362,255 420,172 448,225 488,272 545,286" 
              stroke="#ffffff" stroke-width="2" fill="none" stroke-linejoin="round" />
  </g>

  <!-- ============================================== -->
  <!-- 02. TYPOGRAPHY: "BLACKSTONE"                   -->
  <!-- Western Slab Serif with Inline Carve & Spurs   -->
  <!-- ============================================== -->
  <g id="blackstone-typography" filter="url(#shadow)">
    <!-- Base White Western Letterforms -->
    <text x="300" y="415"
          text-anchor="middle"
          font-family="'Georgia', 'Times New Roman', 'Playfair Display', serif"
          font-size="82"
          font-weight="900"
          letter-spacing="6"
          fill="#ffffff"
          stroke="#000000"
          stroke-width="1.5">
      BLACKSTONE
    </text>

    <!-- Internal Decorative Inline Carve (The distinct groove through the letters) -->
    <text x="300" y="415"
          text-anchor="middle"
          font-family="'Georgia', 'Times New Roman', 'Playfair Display', serif"
          font-size="82"
          font-weight="900"
          letter-spacing="6"
          fill="none"
          stroke="#0d1014"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.95">
      BLACKSTONE
    </text>
  </g>

  <!-- ============================================== -->
  <!-- 03. "JUNK REMOVAL" WITH HORIZONTAL TAPER RULES -->
  <!-- ============================================== -->
  <g id="junk-removal-bar" transform="translate(0, 460)">
    <!-- Left Tapering Horizontal Line -->
    <polygon points="60,0 200,-2 200,2 60,0" fill="#ffffff" />
    <!-- Left Terminal Serif Accent -->
    <circle cx="60" cy="0" r="2" fill="#ffffff" />

    <!-- Subtitle: JUNK REMOVAL -->
    <text x="300" y="8"
          text-anchor="middle"
          font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif"
          font-size="27"
          font-weight="800"
          letter-spacing="8"
          fill="#ffffff">
      JUNK REMOVAL
    </text>

    <!-- Right Tapering Horizontal Line -->
    <polygon points="540,0 400,-2 400,2 540,0" fill="#ffffff" />
    <!-- Right Terminal Serif Accent -->
    <circle cx="540" cy="0" r="2" fill="#ffffff" />
  </g>

  <!-- ============================================== -->
  <!-- 04. BOTTOM DECORATIVE CHEVRON / KEYSTONE MOTIF -->
  <!-- ============================================== -->
  <g id="bottom-chevron" transform="translate(300, 492)">
    <!-- Horizontal Baseline -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#ffffff" stroke-width="2" />
    <line x1="-135" y1="0" x2="-120" y2="0" stroke="#ffffff" stroke-width="1" opacity="0.6" />
    <line x1="120" y1="0" x2="135" y2="0" stroke="#ffffff" stroke-width="1" opacity="0.6" />

    <!-- Inverted Triangle / Keystone -->
    <polygon points="0,22 -45,0 45,0" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Center Vertical Divider Line -->
    <line x1="0" y1="0" x2="0" y2="22" stroke="#ffffff" stroke-width="2.5" />

    <!-- Subtle Inner Fill Accent -->
    <polygon points="0,18 -36,2 36,2" fill="#14171e" opacity="0.8" />
  </g>
</svg>
